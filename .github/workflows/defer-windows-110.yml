name: Defer Windows 1.1.0 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/defer-windows-110.yml]

permissions:
  actions: write
  contents: write

jobs:
  defer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: 'poyal', repo: 'passport' };
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: 36846311401 });
            if (run.head_sha !== '42563e5e2131d554ab1251921141c98e3bf4a64b') throw new Error('Unexpected release source');
            if (run.status !== 'completed') {
              await github.rest.actions.cancelWorkflowRun({ ...repo, run_id: run.id });
              core.info('Requested cancellation of the remaining Windows release job');
            } else {
              core.info(`Release run already completed: ${run.conclusion}`);
            }
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag: 'v1.1.0' });
            if (release.assets.some(asset => asset.name.endsWith('.exe'))) throw new Error('Windows installer already published; review release status');
            const { data: notes } = await github.rest.repos.getContent({ ...repo, path: 'docs/releases/v1.1.0.md', ref: context.sha });
            const body = Buffer.from(notes.content, 'base64').toString('utf8');
            await github.rest.repos.updateRelease({ ...repo, release_id: release.id, body });
