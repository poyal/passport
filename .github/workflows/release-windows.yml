name: Publish Windows release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PASSPORT_DISABLE_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare FTP and FTPS fixtures
        shell: pwsh
        run: |
          python -m pip install -r tests/fixtures/requirements.txt
          "FTP_TEST_PYTHON=$((Get-Command python).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'C:\Program Files\Git\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install dependencies and prepare native ConPTY
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run build:helper
      - run: npm run prepare:runtime -- x64
      - run: npm run check
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify current-user installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/windows-installer-smoke.ps1 -InstallerPath "release/Passport-$version-win-x64.exe"
      - name: Verify packaged Windows app
        env:
          PASSPORT_E2E_EXECUTABLE: ${{ github.workspace }}/release/win-unpacked/Passport.exe
        run: |
          node scripts/packaged-smoke.mjs release/win-unpacked/Passport.exe
          npx playwright test
      - name: Add Windows installer to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-windows-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-verification
          path: |
            release/windows-published.json
            release/installer-*-check.json
            release/SHA256SUMS.txt
            test-results/
          if-no-files-found: ignore
