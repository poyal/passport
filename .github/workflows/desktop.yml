name: Windows file navigation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and build
        shell: pwsh
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose hidden file navigation
        shell: pwsh
        env:
          PASSPORT_FILE_DIAGNOSTICS: "1"
        run: node scripts/e2e.mjs tests/e2e/scroll-workspaces.spec.ts --grep 'file action triggers' --repeat-each 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-file-navigation-diagnostic
          path: release/checks/**
          if-no-files-found: warn
