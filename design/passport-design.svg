<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1710" viewBox="0 0 1600 1710" role="img" aria-labelledby="title description">
  <title id="title">Passport 앱 디자인 결정안</title>
  <desc id="description">차콜과 민트 색상의 SSH 3분할 작업 화면, 호스트 관리, 좌우 파일 전송 화면과 밝은 외형의 색상 기준. 모든 데이터는 가상의 검토용 예시입니다.</desc>
