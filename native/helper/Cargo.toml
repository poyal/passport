[package]
name = "passport-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pem"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
panic = "abort"
