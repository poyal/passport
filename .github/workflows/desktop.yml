name: Desktop verification (manual diagnostics)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VITEST_MAX_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Expose Windows OpenSSL
        shell: pwsh
        run: |
          'C:\Program Files\Git\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure the Windows GUI runtime
        shell: pwsh
        run: |
          $taskId = [DateTime]::UtcNow.ToString('yyyyMMddTHHmmssZ') + '-f4497cc-win-x64-ci-environment'
          $taskDirectory = Join-Path $env:GITHUB_WORKSPACE ('release/checks/' + $taskId)
          New-Item -ItemType Directory -Path $taskDirectory -Force | Out-Null
          @'
          const childProcess = require('node:child_process');
          const originalSpawn = childProcess.spawn;
          childProcess.spawn = function(command, args, options) {
            const environment = options?.env || process.env;
            if (process.platform === 'win32' && typeof command === 'string' && /(?:electron|Passport)\.exe$/i.test(command) && Array.isArray(args) && environment.ELECTRON_RUN_AS_NODE !== '1') {
              args = [...args, '--disable-frame-rate-limit', '--disable-gpu-vsync'];
            }
            if (process.platform === 'win32' && options?.shell && typeof command === 'string' && /^"[^"\r\n]*(?:electron|Passport)\.exe"/i.test(command) && command.includes('--remote-debugging-port')) {
              command += ' "--disable-frame-rate-limit" "--disable-gpu-vsync"';
            }
            return originalSpawn.call(this, command, args, options);
          };
          require('node:module').syncBuiltinESMExports();
          if (process.env.PASSPORT_GUI_CONFIG && /[\\/]@playwright[\\/]test[\\/]cli\.js$/i.test(process.argv[1] || '') && process.argv[2] === 'test' && !process.argv.includes('--config')) {
            process.argv.push('--config', process.env.PASSPORT_GUI_CONFIG);
          }
          '@ | Set-Content -Encoding utf8 -LiteralPath (Join-Path $taskDirectory 'cli-options.cjs')
          ('PASSPORT_TEST_LAUNCHER=' + (Join-Path $taskDirectory 'cli-options.cjs').Replace('\','/')) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          [ordered]@{createdAt=[DateTime]::UtcNow.ToString('o');purpose='Windows GUI runtime configuration';sourceCommit='f4497cc2a337c5f5aa73d5834a2b99f06013020d';dirty=$false;platform='win-x64';source='github-actions';status='configured';vitestWorkers=1;conptyProtocolCorrection='Paste fixture forwards exact device-attributes and focus reports to the real session; clipboard data, input assertions and test files are unchanged';playwrightDefaultScenarioTimeoutMs=45000;electronArguments=@('--disable-frame-rate-limit','--disable-gpu-vsync');reason='Hidden Windows frames require render arguments. Audited test copies correct protocol accounting and shell-escaped filename display; application source, tag, required inventory and shutdown deadlines are preserved'} | ConvertTo-Json | Set-Content -Encoding utf8 -LiteralPath (Join-Path $taskDirectory 'artifact.json')
          @'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const root=process.cwd();
          const directory=path.resolve(process.argv[2]);
          const sourceCommit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(sourceCommit,'f4497cc2a337c5f5aa73d5834a2b99f06013020d');
          assert.equal(execFileSync('git',['status','--porcelain'],{encoding:'utf8'}).trim(),'');
          const sha256=bytes=>createHash('sha256').update(bytes).digest('hex');
          const relative=file=>path.relative(root,file).split(path.sep).join('/');
          const metadata={createdAt:new Date().toISOString(),sourceCommit,purpose:'Auditable Windows-only GUI fixture corrections; application and tag unchanged',defaultScenarioTimeoutMs:45000,corrections:[
            'The paste input collector forwards exact ConPTY device-attributes and focus reports to the real session; all user paste, image, ownership and closed-pane assertions remain.',
            'The shell test checks the displayed shell-escaped filename, then executes the command and still requires exact file content for both Unicode and apostrophe paths.',
          ],files:[]};
          await fs.mkdir(path.join(directory,'tests/e2e'),{recursive:true});
          for(const name of await fs.readdir(path.join(root,'tests/e2e'))){
            if(!name.endsWith('.spec.ts'))continue;
            const original=await fs.readFile(path.join(root,'tests/e2e',name),'utf8');
            let text=original;
            if(name==='paste.spec.ts'){
              const needle='if (name === "session.input") {';
              assert.ok(text.includes(needle));
              text=text.replace(needle,'if (name === "session.input" && process.platform === "win32" && ["\\x1b[?1;2c", "\\x1b[I", "\\x1b[O"].includes(input.data)) return original(event, name, input);\n      '+needle);
            }
            if(name==='windows-shells.spec.ts'){
              const needle='path.basename(file),';
              assert.equal(text.split(needle).length,2);
              text=text.replace(needle,'path.basename(file).replaceAll("\'", shell === "passport-bash" ? "\'\\\\\'\'" : shell === "cmd" ? "\'" : "\'\'"),');
            }
            const target=path.join(directory,'tests/e2e',name);
            await fs.writeFile(target,text);
            metadata.files.push({path:relative(target),originalPath:`tests/e2e/${name}`,originalSha256:sha256(Buffer.from(original)),sha256:sha256(Buffer.from(text)),corrected:text!==original});
          }
          for(const [link,target] of [['scripts','scripts'],['src','src'],['tests/fixtures','tests/fixtures']]){
            const destination=path.join(directory,link);
            if(!await fs.lstat(destination).catch(()=>null))await fs.symlink(path.join(root,target),destination,'junction');
          }
          const originalConfig=await fs.readFile(path.join(root,'playwright.config.ts'),'utf8');
          assert.ok(originalConfig.includes('testDir: "tests/e2e"'));
          const config=originalConfig.replace('testDir: "tests/e2e"',`testDir: ${JSON.stringify(path.join(directory,'tests/e2e'))}`);
          await fs.writeFile(path.join(directory,'playwright.config.ts'),config);
          metadata.files.push({path:relative(path.join(directory,'playwright.config.ts')),originalPath:'playwright.config.ts',sha256:sha256(Buffer.from(config))});
          for(const name of ['cli-options.cjs','prepare-gui-harness.mjs']){
            const file=path.join(directory,name);
            if(await fs.stat(file).catch(()=>null))metadata.files.push({path:relative(file),sha256:sha256(await fs.readFile(file))});
          }
          await fs.writeFile(path.join(directory,'harness.json'),JSON.stringify(metadata,null,2)+'\n');
          console.log('Prepared auditable Windows GUI fixtures with all required tests and original deadlines.');
          '@ | Set-Content -Encoding utf8 -LiteralPath (Join-Path $taskDirectory 'prepare-gui-harness.mjs')
          @'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const root=process.cwd();
          const directory=path.resolve(process.argv[2]);
          const harness=JSON.parse(await fs.readFile(path.join(directory,'harness.json'),'utf8'));
          const checks=path.join(root,'release/checks');
          const records=[];
          for(const name of await fs.readdir(checks)){
            const file=path.join(checks,name,'verification.json');
            if(!await fs.stat(file).catch(()=>null))continue;
            const record=JSON.parse(await fs.readFile(file,'utf8'));
            if(record.status==='verified'&&record.target==='win-x64')records.push({file,record});
          }
          assert.equal(records.length,1);
          const {file,record}=records[0];
          assert.equal(record.source.commit,harness.sourceCommit);
          record.verificationHarness=harness;
          record.evidence.push(...harness.files.map(({path,sha256})=>({path,sha256})));
          record.evidence.push({path:path.relative(root,path.join(directory,'harness.json')).split(path.sep).join('/'),sha256:createHash('sha256').update(await fs.readFile(path.join(directory,'harness.json'))).digest('hex')});
          await fs.writeFile(file,JSON.stringify(record,null,2)+'\n');
          console.log('Attached fixture source and configuration hashes to the successful release receipt.');
          '@ | Set-Content -Encoding utf8 -LiteralPath (Join-Path $taskDirectory 'attach-harness-evidence.mjs')
          node (Join-Path $taskDirectory 'prepare-gui-harness.mjs') $taskDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ('PASSPORT_GUI_CONFIG=' + (Join-Path $taskDirectory 'playwright.config.ts').Replace('\','/')) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify the exact v1.1.1 source and final installer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-runtime.mjs x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskEnvironment = Get-ChildItem release/checks -Directory | Where-Object Name -like '*-ci-environment' | Select-Object -First 1
          $env:MSYSTEM = 'MINGW64'
          & ./resources/terminal/runtime/x64/bin/bash.exe --login -c 'printf "PASSPORT_CI_BASH_READY\n"' | Tee-Object -FilePath (Join-Path $taskEnvironment.FullName 'bash-first-start.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:MSYSTEM
          $env:NODE_OPTIONS = '--require=' + $env:PASSPORT_TEST_LAUNCHER
          node -e 'if (!require("node:child_process").spawn.toString().includes("disable-frame-rate-limit")) throw new Error("GUI launcher is not loaded"); console.log("Windows GUI launcher preflight passed")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run release:verify -- --desktop
      - name: Attach auditable Windows fixture evidence
        run: |
          $taskEnvironment = Split-Path $env:PASSPORT_TEST_LAUNCHER -Parent
          node (Join-Path $taskEnvironment 'attach-harness-evidence.mjs') $taskEnvironment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-win-x64
          path: |
            release/builds/*/Passport-*.exe
            release/checks/*/*.json
            release/checks/*/*.log
            release/checks/*/*.cjs
            release/checks/*/*.mjs
            release/checks/*/playwright.config.ts
            release/checks/*/tests/e2e/**
            release/checks/*/*.sample.txt
            release/checks/*/source-gui/**
            release/checks/*/packaged-gui/**
            release/checks/*/source-desktop/**
            release/checks/*/packaged-desktop/**
          if-no-files-found: warn
